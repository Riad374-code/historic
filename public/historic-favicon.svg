    <circle cx="73" cy="86" r="3" fill="#ffffff" />
    <circle cx="70" cy="101" r="3" fill="#ffffff" />
    <circle cx="145" cy="86" r="3" fill="#ffffff" />
    <circle cx="147" cy="101" r="3" fill="#ffffff" />
