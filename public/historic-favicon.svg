<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Historic AI PDF icon</title>
  <desc id="desc">Orange rounded square icon showing AI chip connected to a PDF sheet.</desc>
  <defs>
    <linearGradient id="bg" x1="22" y1="22" x2="234" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a1f" />
      <stop offset="1" stop-color="#e24c00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8e2d00" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="14" y="14" width="228" height="228" rx="44" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="14" y="14" width="228" height="228" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="6" />

