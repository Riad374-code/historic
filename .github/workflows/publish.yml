name: publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: verify app versions are consistent
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); const cargoMatch = cargoToml.match(/^version\s*=\s*\"([^\"]+)\"/m); if (!cargoMatch) { console.error('Could not read version from src-tauri/Cargo.toml'); process.exit(1); } const cargoVersion = cargoMatch[1]; const versions = [pkg.version, tauri.version, cargoVersion]; if (!versions.every((v) => v === pkg.version)) { console.error('Version mismatch across files: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', Cargo.toml=' + cargoVersion); process.exit(1); } if (!/^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$/.test(pkg.version)) { console.error('package.json version is not semver-like: ' + pkg.version); process.exit(1); } console.log('All app versions are consistent: ' + pkg.version);"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NSIS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NSIS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Optional updater signature secrets if updater is enabled:
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: App v__VERSION__
          releaseBody: See the assets to download this version.
          releaseDraft: true
