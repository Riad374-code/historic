name: publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: verify app versions are consistent
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json

          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersionLine = ($cargoToml -split "`n" | Where-Object { $_ -match '^\s*version\s*=' } | Select-Object -First 1)
          if (-not $cargoVersionLine) { throw "Could not find version line in src-tauri/Cargo.toml" }

          $cargoVersion = ($cargoVersionLine -split '"')[1]

          $v1 = $pkg.version
          $v2 = $tauri.version
          $v3 = $cargoVersion

          Write-Host "package.json: $v1"
          Write-Host "tauri.conf.json: $v2"
          Write-Host "Cargo.toml: $v3"

          if ($v1 -ne $v2 -or $v1 -ne $v3) {
            throw "Version mismatch: package.json=$v1, tauri.conf.json=$v2, Cargo.toml=$v3"
          }

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NSIS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NSIS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Optional updater signature secrets if updater is enabled:
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: App v__VERSION__
          releaseBody: See the assets to download this version.
          releaseDraft: true
