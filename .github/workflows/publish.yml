name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: verify tag and versions are consistent
        run: |
          node -e "const fs = require('fs'); const ref = process.env.GITHUB_REF_NAME || ''; if (!/^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$/.test(ref)) { console.error('Tag must look like vX.Y.Z, got: ' + ref); process.exit(1); } const tag = ref.slice(1); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); const cargoMatch = cargoToml.match(/^version\s*=\s*\"([^\"]+)\"/m); if (!cargoMatch) { console.error('Could not read version from src-tauri/Cargo.toml'); process.exit(1); } const cargoVersion = cargoMatch[1]; const versions = [pkg.version, tauri.version, cargoVersion]; if (!versions.every((v) => v === pkg.version)) { console.error('Version mismatch across files: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', Cargo.toml=' + cargoVersion); process.exit(1); } if (tag !== pkg.version) { console.error('Tag version ' + tag + ' does not match app version ' + pkg.version); process.exit(1); } console.log('Tag and all app versions are consistent: ' + pkg.version);"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional updater signature secrets:
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Optional macOS signing/notarization secrets:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional Windows signing secrets:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: App ${{ github.ref_name }}
          releaseBody: See the assets to download this version.
          releaseDraft: true
